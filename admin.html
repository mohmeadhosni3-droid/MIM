<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم ميم</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0a;color:#f4f0e8;font-family:Tahoma,Arial}.wrap{width:min(1400px,calc(100% - 30px));margin:auto}.top{padding:20px 0;border-bottom:1px solid #fff1;position:sticky;top:0;background:#090a0af2;backdrop-filter:blur(12px);z-index:5}.topin{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:440px 1fr;gap:20px;padding:25px 0}.card{background:#121414;border:1px solid #fff1;border-radius:16px;padding:20px;margin-bottom:14px}.card h2{font-size:17px;margin:0 0 15px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px}.field input,.field textarea{width:100%;background:#0b0c0c;border:1px solid #fff2;border-radius:9px;padding:10px;color:#fff}.field textarea{min-height:85px}.btn{border:1px solid #fff2;border-radius:9px;padding:10px 15px;background:#181a1a;color:#eee;cursor:pointer;font-weight:700}.primary{background:#c9a96a;color:#111;border-color:#c9a96a}.preview{width:100%;height:calc(100vh - 120px);min-height:650px;border:1px solid #fff2;border-radius:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:12px;color:#888}.toast{position:fixed;bottom:20px;left:20px;background:#161818;border:1px solid #c9a96a55;padding:12px 18px;border-radius:10px;display:none}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #fff1;padding:9px;border-radius:10px;margin-top:8px}.thumb{width:65px;height:50px;object-fit:cover;border-radius:7px}@media(max-width:1000px){.grid{grid-template-columns:1fr}.preview{height:700px}}@media(max-width:550px){.row{grid-template-columns:1fr}.topin{display:block}.topin button{margin-top:10px}}
</style></head><body><header class="top"><div class="wrap topin"><div><b>م | لوحة تحكم الموقع</b><div class="status" id="status">جاهز</div></div><button class="btn primary" id="sync">مزامنة الموقع</button></div></header><main class="wrap grid"><section>
<div class="card"><h2>بيانات الموقع</h2><div class="field"><label>اسم الشركة</label><input id="siteName"></div><div class="row"><div class="field"><label>العلامة المختصرة</label><input id="mark"></div><div class="field"><label>الشارة</label><input id="badge"></div></div><div class="field"><label>العنوان الرئيسي</label><input id="heroTitle"></div><div class="field"><label>الوصف</label><textarea id="heroText"></textarea></div><div class="field"><label>رابط واتساب</label><input id="whatsapp"></div></div>
<div class="card"><h2>الخدمات</h2><div id="services"></div></div>
<div class="card"><h2>العرض</h2><label><input id="offerActive" type="checkbox"> إظهار العرض</label><div class="field"><label>العنوان</label><input id="offerTitle"></div><div class="field"><label>الوصف</label><textarea id="offerText"></textarea></div><div class="row"><div class="field"><label>السعر / العبارة</label><input id="offerPrice"></div><div class="field"><label>الزر</label><input id="offerButton"></div></div></div>
<div class="card"><h2>إضافة مشروع</h2><div class="field"><label>اسم المشروع</label><input id="workTitle"></div><div class="field"><label>التصنيف</label><input id="workTag"></div><div class="field"><input id="workFile" type="file" accept="image/*"></div><button class="btn primary" id="addWork">رفع الصورة</button><div id="workList"></div></div>
<div class="card"><h2>إضافة فيديو</h2><div class="field"><label>عنوان الفيديو</label><input id="videoTitle"></div><div class="field"><label>التصنيف</label><input id="videoTag"></div><div class="field"><input id="videoFile" type="file" accept="video/*"></div><button class="btn primary" id="addVideo">رفع الفيديو</button><div id="videoList"></div><p style="font-size:11px;color:#888">يفضل ضغط الفيديو قبل الرفع. GitHub ليس مستودع فيديوهات عملاقًا، رغم أن البشر يحبون جعله كذلك.</p></div>
</section><section><iframe id="preview" class="preview" src="../MIM/"></iframe></section></main><div class="toast" id="toast"></div><script>
const OWNER="mohmeadhosni3-droid",REPO="MIM",BRANCH="main";let d={services:[],portfolio:[],videos:[],offer:{}};let sha=null;const $=x=>document.getElementById(x),token=()=>sessionStorage.getItem("mim-token")||"";
function msg(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",3000)}
async function api(path,opt={}){let r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path,{...opt,headers:{"Authorization":"Bearer "+token(),"Accept":"application/vnd.github+json"}});let j=await r.json();if(!r.ok)throw Error(j.message);return j}
async function load(){if(!token()){let t=prompt("أدخل GitHub Fine-grained Token بصلاحية Contents: Read and write لهذا المستودع فقط");if(!t)return;sessionStorage.setItem("mim-token",t)}try{let r=await api("content.json");sha=r.sha;d=JSON.parse(atob(r.content.replace(/\n/g,"")));fill();$("status").textContent="متصل بالمستودع"}catch(e){msg(e.message)}}
function fill(){$("siteName").value=d.siteName||"";$("mark").value=d.brandMark||"";$("badge").value=d.badge||"";$("heroTitle").value=d.heroTitle||"";$("heroText").value=d.heroText||"";$("whatsapp").value=d.whatsapp||"";$("offerActive").checked=!!d.offer?.active;$("offerTitle").value=d.offer?.title||"";$("offerText").value=d.offer?.text||"";$("offerPrice").value=d.offer?.price||"";$("offerButton").value=d.offer?.button||"اطلب العرض";renderServices();renderLists()}
function renderServices(){$("services").innerHTML=(d.services||[]).map((s,i)=>'<div class="field"><label>الخدمة '+(i+1)+'</label><input data-i="'+i+'" data-k="title" value="'+e(s.title)+'"><input style="margin-top:5px" data-i="'+i+'" data-k="text" value="'+e(s.text)+'"></div>').join("");document.querySelectorAll("#services input").forEach(x=>x.oninput=()=>d.services[x.dataset.i][x.dataset.k]=x.value)}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function renderLists(){["portfolio","videos"].forEach(type=>{$(type==="portfolio"?"workList":"videoList").innerHTML=(d[type]||[]).map((x,i)=>'<div class="item">'+(type==="portfolio"?'<img class="thumb" src="'+x.url+'">':'<span>▶</span>')+'<span style="flex:1">'+e(x.title)+'<small style="display:block;color:#888">'+e(x.tag)+'</small></span><button class="btn" onclick="delItem(\''+type+'\','+i+')">حذف</button></div>').join("")})}
function delItem(t,i){d[t].splice(i,1);renderLists()}
function read(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)})}
async function upload(f,path){let content=await read(f);let r=await api(path,{method:"PUT",body:JSON.stringify({message:"Upload MIM media",content,branch:BRANCH})});return "https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/"+path+"?v="+Date.now()}
$("addWork").onclick=async()=>{let f=$("workFile").files[0];if(!f)return msg("اختر صورة");try{let url=await upload(f,"portfolio/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"-"));d.portfolio.push({title:$("workTitle").value||"مشروع",tag:$("workTag").value||"PROJECT",url});renderLists();msg("تم رفع الصورة، اضغط مزامنة")}catch(e){msg(e.message)}};
$("addVideo").onclick=async()=>{let f=$("videoFile").files[0];if(!f)return msg("اختر فيديو");if(f.size>35000000)return msg("الفيديو أكبر من 35MB");try{let url=await upload(f,"portfolio/videos/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"-"));d.videos.push({title:$("videoTitle").value||"فيديو",tag:$("videoTag").value||"VIDEO",url});renderLists();msg("تم رفع الفيديو، اضغط مزامنة")}catch(e){msg(e.message)}};
$("sync").onclick=async()=>{try{d.siteName=$("siteName").value;d.brandMark=$("mark").value;d.badge=$("badge").value;d.heroTitle=$("heroTitle").value;d.heroText=$("heroText").value;d.whatsapp=$("whatsapp").value;d.offer={active:$("offerActive").checked,title:$("offerTitle").value,text:$("offerText").value,price:$("offerPrice").value,button:$("offerButton").value};let content=btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2))));let r=await api("content.json",{method:"PUT",body:JSON.stringify({message:"Update MIM content",content,sha,branch:BRANCH})});sha=r.content.sha;$("preview").src="./?v="+Date.now();msg("تمت المزامنة بنجاح");$("status").textContent="آخر مزامنة الآن"}catch(e){msg(e.message)}};load();
</script></body></html>
